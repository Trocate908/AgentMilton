kind = "web"
previewPath = "/"
title = "AgentMilton"
description = "A private, single-owner coding workspace for inspecting GitHub projects and preparing safe AI-assisted changes with OpenRouter, with repository writes gated by explicit approval."
version = "1.0.0"
id = "artifacts/agentmilton"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25946

[services.development]
run = "pnpm --filter @workspace/agentmilton run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agentmilton", "run", "build" ]
serve = "static"
publicDir = "artifacts/agentmilton/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25946"
BASE_PATH = "/"
